# docker-compose.yaml
# Docker Compose for BioMed Research Suite
version: '3.8'

services:
  backend:
    build: .
    container_name: biomed-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - biomed-network

  frontend:
    image: nginx:alpine
    container_name: biomed-frontend
    ports:
      - "8080:80"
    volumes:
      - ./biomed_suite_pro.html:/usr/share/nginx/html/index.html:ro
      - ./unified_biomedical_suite.html:/usr/share/nginx/html/basic.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - biomed-network

networks:
  biomed-network:
    driver: bridge

volumes:
  biomed-data:
